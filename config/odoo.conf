[options]
; Configuración común. La conexión a PostgreSQL se define con variables de entorno.
; No guardar contraseñas en este archivo.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
; En producción, configura proxy_mode = True solo si Odoo está detrás de un proxy inverso
; correctamente configurado (por ejemplo, Nginx o Traefik).
; proxy_mode = True
