# Desarrollo: activa herramientas de desarrollo y monta los addons editables.
services:
  web:
    command: ["--dev=all", "-i", "base"]
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"

  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
